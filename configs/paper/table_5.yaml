# Table 5 -- prompt engineering: in-context learning, chain-of-thought,
# role-play and self-reflection.
#
# COT and SR generate up to 512 tokens per sample instead of one, so these run
# on the 500-sample cohort (random_index 6) and use `--scoring generate`: the
# answer is embedded in prose and has to be parsed out. That path records no
# PROB column, hence F1 only.

produces: "Table 5 -- prompt engineering"
datasets: [mimic3, mimic4]
tasks: [length_pred, mortality_pred, readmission_pred]
random_indices: [6]
# The table shows each model's base row on the 500-sample cohort followed by
# its + ICL / + CoT / + RP / + SR rows, so ORI belongs here too.
modes: [ORI, ICL, COT, RP, SR]
scoring_by_mode: { ORI: logits, ICL: logits, RP: logits, COT: generate, SR: generate }
# NOTE: Meditron-70B's index-6 files were originally named
# `Llama3-meditron-70b`, which did not match its checkpoint id. They reproduce
# the published Meditron-70B row exactly and have been renamed to the canonical
# `meditron-70b`; see docs/reproduction.md.
models: [prompt_traditional, prompt_llms]
metrics: [f1]
