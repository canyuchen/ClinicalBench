name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # No GPU and no MIMIC access needed: these check that the cohort spec still
      # matches the shipped index files, that the prompt builder reproduces the
      # released prompts byte-for-byte, and that the evaluator still reproduces
      # the paper's Table 1 numbers from the released result files.
      - name: Test
        run: pytest tests/ -q

      - name: Paper configs expand and resolve
        run: |
          for config in configs/paper/*.yaml; do
            echo "== $config"
            python -m clinicalbench.experiments "$config" --check || true
          done

      - name: Wheel builds and does not shadow PyHealth
        run: |
          pip install build
          python -m build --wheel --outdir /tmp/dist
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob('/tmp/dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.startswith('clinicalbench/') for n in names), "package missing"
          assert not any(n.startswith('pyhealth/') for n in names), \
              "vendored PyHealth must not install as a top-level `pyhealth`"
          print("wheel ok:", wheel)
          PY
